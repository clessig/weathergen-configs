METEOSAT_SEVIRI :
  type : obs
  stream_id : 10
  filenames : ['observations-file-2014-2025-seviri-n320-1h-v1.zarr']
  geoinfo_channels : ['cos_local_time', 'sin_local_time', 'cos_julian_day', 'sin_julian_day', 'zenith', 'cos_sza']
  loss_weight : 1.0
  location_weight : cosine_latitude
  masking_override :
    model_input :
      masking_strategy: "random"
      masking_strategy_config :
        rate: 1.0
  token_size : 1024
  tokenize_spacetime : False
  forcing: True
  embed : 
    net : linear

