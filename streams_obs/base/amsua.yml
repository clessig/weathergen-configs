NOAA15_AMUSA :
  type : obs
  stream_id : 30
  filenames : ['observations-ea-ofb-0001-1998-2023-noaa-15-amsua-radiances-v1.zarr']
  geoinfo_channels : ['cos_local_time', 'sin_local_time', 'cos_julian_day', 'sin_julian_day', 'cos_sza']
  loss_weight : 1.0
  masking_override :
    model_input :
      masking_strategy_config :
        rate: 1.0
  token_size : 512 # 256
  forcing: True
  embed : 
