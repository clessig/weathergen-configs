# ---- encoder / decoder: fo7hw0en architecture (from models/fo7hw0en/model_fo7hw0en_chkpt00076.json)
embed_orientation: "channels"
embed_unembed_mode: "block"
embed_dropout_rate: 0.0
embed_final_dropout_rate: 0.0  # fo7hw0en key, not read by this branch (neutral value)

ae_local_dim_embed: 1024
ae_local_num_blocks: 4
ae_local_num_heads: 16
ae_local_dropout_rate: 0.0
ae_local_with_qk_lnorm: True

ae_local_num_queries: 1
ae_local_queries_per_cell: False
ae_local_max_tokens_per_cell: 64  # fo7hw0en (code default)
ae_adapter_num_heads: 16
ae_adapter_embed: 128
ae_adapter_with_qk_lnorm: True
ae_adapter_with_residual: True
ae_adapter_dropout_rate: 0.0

ae_global_dim_embed: 2048
ae_global_num_blocks: 5
ae_global_num_heads: 16
ae_global_dropout_rate: 0.0
ae_global_with_qk_lnorm: True
ae_global_att_dense_rate: 1.0
ae_global_block_factor: 64
ae_global_mlp_hidden_factor: 4
ae_global_trailing_layer_norm: True

ae_aggregation_num_blocks: 5
ae_aggregation_num_heads: 16
ae_aggregation_dropout_rate: 0.0
ae_aggregation_with_qk_lnorm: True
ae_aggregation_att_dense_rate: 1.0
ae_aggregation_block_factor: 64
ae_aggregation_mlp_hidden_factor: 4

decoder_type: PerceiverIOCoordConditioning
pred_adapter_kv: False
pred_self_attention: True
pred_dyadic_dims: False
pred_mlp_adaln: True
pred_dropout_rate: 0.0 
num_class_tokens: 0
num_register_tokens: 64  

# ---- forecast engine 
fe_num_blocks: 12
fe_num_heads: 16
fe_dropout_rate: 0.1
fe_with_qk_lnorm: True
fe_layer_norm_after_blocks: [11]  # Index starts at 0. Thus, [3] adds a LayerNorm after the fourth block
fe_impute_latent_noise_std: 0.0  # 1e-4
# currently fixed to 1.0 (due to limitations with flex_attention and triton)
forecast_att_dense_rate: 1.0
with_step_conditioning: True # False

diffusion:
  enabled: True
  type: flow_matching
  # width of the denoiser: encoder tokens (ae_global_dim_embed) are projected up to latent_dim
  # inside the network and back. Noise is added in the encoder token space (2048).
  latent_dim: 2560
  # learnable register tokens of the denoiser (independent of the encoder's register tokens)
  num_register_tokens: 0
  conditioning: "forecast"
  conditioning_type: "concatenate"
  impute_latent_noise_std: 1e-3  # training: std of Gaussian noise added to the conditioning tokens
  classifier_free_guidance_prob: 0.0
  frequency_embedding_dim: 256
  embedding_dim: 512  # must be 512: the noise conditioning in model/layers.py hard-codes 512
  noise_embedding:
    type: "dit_legacy"
  flow_matching:
    path: ve
    prediction_type: denoiser
    sigma_data: 1.0
    edm_preconditioning: False
    sampler:
      type: ode
      rho: 7
  sampler:
    num_steps: null
    num_ensemble_members: 1

# inference_logging:
#   fe_diffusion_log_analytics: False  # inference: write per-step diffusion diagnostics

healpix_level: 5

rope_2D: True
rope_2D_coord_scale: 30.0
pe_global_latlon: True
mlp_type: swiglu
use_xsa: True

with_mixed_precision: True
with_flash_attention: True
compile_model: False
with_fsdp: True
attention_dtype: bf16
mixed_precision_dtype: bf16
mlp_norm_eps: 1e-5
norm_eps: 1e-4

latent_noise_kl_weight: 0.0 # 1e-5
latent_noise_gamma: 2.0
latent_noise_saturate_encodings: 5
latent_noise_use_additive_noise: False
latent_noise_deterministic_latents: True

#below for FE training only
freeze_modules: ".*latent_pre_norm.*|.*latent_heads.*|.*pred_heads.*|.*target_token_engines.*|.*embed_target_coords.*|.*encoder.*|.*StreamEmbedder_ERA5.*|.*embed_engine.*|.*ae_local_engine.*|.*ae_local_global_engine.*|.*ae_global_engine.*"
#below for DECODER training only
# freeze_modules: ".*latent_pre_norm.*|.*latent_heads.*|.*encoder.*|.*StreamEmbedder_ERA5.*|.*embed_engine.*|.*noise_embedder.*|.*fe.*|.*latent_proj.*|.*ae_local_engine.*|.*ae_local_global_engine.*|.*ae_global_engine.*"
#below for FE and DECODER training
# freeze_modules: ".*latent_pre_norm.*|.*latent_heads.*|.*encoder.*|.*StreamEmbedder_ERA5.*|.*embed_engine.*|.*ae_local_engine.*|.*ae_local_global_engine.*|.*ae_global_engine.*"

load_chkpt: {'run_id': 'fo7hw0en', 'mini_epoch': 76}  # autoencoder (encoder + decoder), pinned

norm_type: "LayerNorm"
qk_norm_type: "RMSNorm"

#####################################

# fo7hw0en's streams (gjl6a0kb_reproduction_n320_new_channels_forecast_iasi_channels) with
# forcing/diagnostic off, input targets [] and ERA5 as target-only stream.
streams_directory: "<FULL_PATH_TO>/weathergen-configs/diffusion/streams/fo7hw0en_diffusion/"
streams: ???

zarr_store: "zip"

general:

  # mutable parameters
  istep: 0
  rank: ???
  world_size: ???

  # local_rank,
  # with_ddp,
  # data_path_*,
  # model_path,
  # run_path,
  # path_shared_

  multiprocessing_method: "fork"

  desc: ""
  run_id: ???
  run_history: []

train_logging:
  terminal: 10
  metrics: 20
  checkpoint: 250
  log_grad_norms: False

data_loading:
  num_workers: 8
  num_workers_validation: 4
  memory_pinning: False
  rng_seed: ???
  repeat_data_in_mini_epoch: False

training_config:
  training_mode: ["masking", "student_teacher"]

  num_mini_epochs: 128
  samples_per_mini_epoch: 4096
  shuffle: True

  start_date: 1979-01-01T00:00
  end_date: 2022-12-31T00:00

  time_window_step: 06:00:00
  time_window_len: 06:00:00

  learning_rate_scheduling :
    lr_start: 1e-6 #5e-5
    lr_max: 1e-4
    lr_final_decay: 1e-6
    lr_final: 0.0
    num_steps_warmup: 64
    num_steps_cooldown: 512
    policy_warmup: "cosine"
    policy_decay: "constant"
    policy_cooldown: "linear"
    parallel_scaling_policy: "sqrt"

  optimizer:
    grad_clip: 1.0
    weight_decay: 0.1
    log_grad_norms: False
    adamw :
      # parameters are scaled by number of DDP workers
      beta1 : 0.975
      beta2 : 0.9875
      eps : 2e-08

  losses : {
    "latent_diff": {
        type: LossFlowMatching,
        weight: 1.0,
        target_and_aux_calc: DiffusionLatentTargetEncoder,
        loss_fcts: { "mse": { }, },
        }
  }

  model_input: {
    "forecasting" : {
      # masking strategy: "random", "healpix", "forecast"
      masking_strategy: "forecast",
      num_steps_input: 2,
      num_samples: 1,
      }
    }

  target_input: {
    "forecasting" : {
      masking_strategy: "forecast",
      masking_strategy_config: {
        noise_level: {distribution: "log_uniform", sigma_min: 0.4, sigma_max: 50},
        },
      num_steps_input: 1,
      num_samples: 1,
      }
    }

  forecast :
      time_step: 06:00:00
      num_steps: 1
      offset: 0
      policy: "fixed"
      # chunk_size: 4


validation_config:

  samples_per_mini_epoch: 64
  shuffle: True

  start_date: 2023-10-01T00:00
  end_date: 2023-12-31T18:00

  # whether to track the exponential moving average of weights for validation
  validate_with_ema:
    enabled : True
    ema_ramp_up_ratio: 0.09
    ema_halflife_in_thousands: 1e-3

  # parameters for validation samples that are written to disk
  output : {
    # number of samples that are written
    num_samples: 0,
    # write samples in normalized model space
    normalized_samples: False,
    # output streams to write; default all
    streams: null,
    }

  # run validation before training starts (mainly for model development)
  validate_before_training: False


wgtags:
  # The name of the organization of the person running the experiment.
  # Expected values are lowercase strings e.g. "ecmwf", "cmcc", "metnor", "jsc", "escience"
  org: jsc
  # The Github issue corresponding to this run (number such as 1234)
  issue: null
  # The name of the experiment, the primary tag for comparing experiments in MLFlow.
  exp: fm_compare
  # *** Experiment-specific tags ***
  grid: ve
