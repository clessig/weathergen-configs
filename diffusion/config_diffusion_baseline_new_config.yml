embed_orientation: "channels"
embed_unembed_mode: "block"
embed_dropout_rate: 0.1

ae_local_dim_embed: 2048
ae_local_num_blocks: 2
ae_local_num_heads: 16
ae_local_dropout_rate: 0.1
ae_local_with_qk_lnorm: True

ae_local_num_queries: 1
ae_local_queries_per_cell: False
ae_local_max_tokens_per_cell: 64
ae_adapter_num_heads: 16
ae_adapter_embed: 128
ae_adapter_with_qk_lnorm: True
ae_adapter_with_residual: True
ae_adapter_dropout_rate: 0.1

ae_global_dim_embed: 2048
ae_global_num_blocks: 4
ae_global_num_heads: 32
ae_global_dropout_rate: 0.1
ae_global_with_qk_lnorm: True
ae_global_att_dense_rate: 1.0
ae_global_block_factor: 64
ae_global_mlp_hidden_factor: 2
ae_global_trailing_layer_norm: False

ae_aggregation_num_blocks: 0
ae_aggregation_num_heads: 32
ae_aggregation_dropout_rate: 0.1
ae_aggregation_with_qk_lnorm: True
ae_aggregation_att_dense_rate: 1.0
ae_aggregation_block_factor: 64
ae_aggregation_mlp_hidden_factor: 2

decoder_type: PerceiverIOCoordConditioning
pred_adapter_kv: False
pred_self_attention: True
pred_dyadic_dims: False
pred_mlp_adaln: True
num_class_tokens: 0
num_register_tokens: 0

# number of steps offset applied to first target window; if set to zero and forecast_steps=0 then
# one is training an auto-encoder
fe_num_blocks: 12
fe_num_heads: 16
fe_dropout_rate: 0.1
fe_with_qk_lnorm: True
fe_layer_norm_after_blocks: [11]  # Index starts at 0. Thus, [3] adds a LayerNorm after the fourth block
fe_impute_latent_noise_std: 0.0  # 1e-4
# currently fixed to 1.0 (due to limitations with flex_attention and triton)
forecast_att_dense_rate: 1.0
with_step_conditioning: True # False

# Diffusion related parameters
diffusion:
  enabled: True  # wrap the forecast engine in a diffusion model
  latent_dim: 2560
  # learnable register tokens of the denoiser (independent of the encoder's register tokens)
  num_register_tokens: 0

  # conditioning: "forecast" (encoded older input steps), "date_time", "date", "time"
  # or null (unconditional)
  conditioning: "forecast"

  # conditioning_type:
  #   - "forecast": "concatenate" (sequence dim), "concatenate_hiddendim", "concatenate_hdMLP",
  #               "cross_attn", "cross_attn_rev", "additive", "spatial_ada_ln"
  #   - "date_time" / "date" / "time": "ada_ln" (requires conditioning_embed_dim)
  conditioning_type: "concatenate"
  
  # conditioning_embed_dim: null  # required for conditioning_type "ada_ln"
  impute_latent_noise_std: 1e-3  # training: std of Gaussian noise added to the conditioning tokens
  classifier_free_guidance_prob: 0.0  # training: probability of zeroing the conditioning tokens
  predict_residual: False  # inference: decode conditioning tokens + prediction (residual)

  sigma_data: 1.0  # std of the clean latents (EDM sigma_data)
  edm_preconditioning: False  # True: EDM c_skip/c_out preconditioning; False: predict x0 directly
  loss_weighting: "edm"  # per-noise-level loss weight: "edm", "min_snr_gamma", "uniform_x0"
  # min_snr_gamma: 5.0  # only for loss_weighting "min_snr_gamma"
  # rollout: False  # inference: decode the final denoised state via the rollout/ensemble path

  # embedding of the noise level c_noise = ln(sigma) / 4
  frequency_embedding_dim: 256  # number of sinusoidal features
  embedding_dim: 512  # must be 512: the noise conditioning in model/layers.py hard-codes 512
  noise_embedding:
    # "dit_legacy" (default, used by existing checkpoints) or "log_fourier" (recommended for new
    # runs, e.g. {type: "log_fourier", f_min: 0.5, f_max: 25.13, include_raw: True})
    type: "dit_legacy"
    # f_min: 0.5  # log_fourier only: lowest frequency
    # f_max: 25.13  # log_fourier only: highest frequency (8*pi)
    # include_raw: True  # log_fourier only: append c_noise itself as an extra feature

  # The training noise level distribution is set per target strategy in
  # training_config.target_input.<strategy>.masking_strategy_config.noise_level (see below).

  # inference sampler: EDM Heun sampler from sigma_max down to sigma_min (Karras et al. 2022)
  sampler:
    num_steps: null  # number of denoising steps; null = 10
    rho: 7  # spacing of the noise levels; larger values place more steps at low sigma
    sigma_min: null  # null = sigma_min_quantile of the training noise level distribution
    sigma_max: null  # null = upper bound of the training noise level distribution
    sigma_min_quantile: 0.05  # only used if sigma_min is null
    num_ensemble_members: 1  # > 1: draw this many ensemble members per forecast
    # stochastic sampling (Karras et al. 2022, Alg. 2); s_churn = 0: deterministic sampler
    s_churn: 0.0  # amount of noise re-injected per step
    s_min: 0.0  # noise is only re-injected for sigma in [s_min, s_max]
    s_max: null  # null = no upper limit
    s_noise: 1.0  # scale of the re-injected noise

# inference_logging:
#   fe_diffusion_log_analytics: False  # inference: write per-step diffusion diagnostics

healpix_level: 5

# Use 2D RoPE instead of traditional global positional encoding
# When True: uses 2D RoPE based on healpix cell coordinates (lat/lon)
# When False: uses traditional pe_global positional encoding
rope_2D: True
mlp_type: mlp
use_xsa: False
# mlp_type: swiglu
# use_xsa: True

with_mixed_precision: True
with_flash_attention: True
compile_model: False
with_fsdp: True
attention_dtype: bf16
mixed_precision_dtype: bf16
mlp_norm_eps: 1e-5
norm_eps: 1e-4

latent_noise_kl_weight: 0.0 # 1e-5
latent_noise_gamma: 2.0
latent_noise_saturate_encodings: 5 
latent_noise_use_additive_noise: False
latent_noise_deterministic_latents: True

#below for FE training only
freeze_modules: ".*latent_pre_norm.*|.*latent_heads.*|.*pred_heads.*|.*target_token_engines.*|.*embed_target_coords.*|.*encoder.*|.*StreamEmbedder_ERA5.*|.*embed_engine.*|.*ae_local_engine.*|.*ae_local_global_engine.*|.*ae_global_engine.*"
#below for DECODER training only
# freeze_modules: ".*latent_pre_norm.*|.*latent_heads.*|.*encoder.*|.*StreamEmbedder_ERA5.*|.*embed_engine.*|.*noise_embedder.*|.*fe.*|.*latent_proj.*|.*ae_local_engine.*|.*ae_local_global_engine.*|.*ae_global_engine.*"
#below for FE and DECODER training
# freeze_modules: ".*latent_pre_norm.*|.*latent_heads.*|.*encoder.*|.*StreamEmbedder_ERA5.*|.*embed_engine.*|.*ae_local_engine.*|.*ae_local_global_engine.*|.*ae_global_engine.*"

