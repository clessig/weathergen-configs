parallelize: false
# !!! BE CAREFUL !!!
# Parallelization is supported but not recommended — can lead to unexpected issues.

# launch with
# ../WeatherGenerator-Private/launch-slurm.py --pipeline pipeline_forecasting.yml

stages:
  - name: pretrain
    stage: train
    base_config: ../weathergen-configs/s2s2d/config_forecasting.yml
    chain_jobs: 4
    nodes: 2
    # slurm_args:
    #   - "--time=12:00:00"

  - name: finetune
    stage: train
    from_run_id: STAGE.pretrain
    config_files:
      - ../weathergen-configs/s2s2d/config_forecasting_finetuning.yml
    chain_jobs: 4
    nodes: 2
    # slurm_args:
    #   - "--time=12:00:00"

  - name: infer
    stage: inference
    from_run_id: STAGE.finetune
    options:
      - test_config.forecast.num_steps=20
      - test_config.samples_per_mini_epoch=16
      - test_config.output.num_samples=16
    nodes: 1
    slurm_args:
      - "--time=02:00:00"

  - name: eval
    stage: evaluation
    eval_config: ../weathergen-configs/s2s2d/config_eval_s2s.yml
    run_ids: [STAGE.infer]
    nodes: 1
    slurm_args:
      - "--time=02:00:00"
